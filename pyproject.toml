[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-lufa"
version = "0.1.0"
description = "Independent speech/text facial-animation retrieval research baseline"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3", "torch>=2.2,<3", "transformers>=4.40,<5"]

[project.scripts]
lufa = "lufa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
